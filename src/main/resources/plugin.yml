name: SimplePortals
version: '${project.version}'
main: dev.nerdlabs.simpleportals.SimplePortals
api-version: '26.1'
authors: [ nerdlabs-dev, XZot1K ]
softdepend: [ Multiverse-Core ]
description: Simple region portals, local or cross-server (Velocity/BungeeCord).

commands:
  simpleportals:
    description: Manage portals.
    usage: /<command> help
    aliases: [ sp, portal, portals, sportal, sportals ]
    permission: simpleportals.use

permissions:
  simpleportals.admin:
    description: Everything in the plugin.
    default: op
    children:
      simpleportals.use: true
      simpleportals.selectionmode: true
      simpleportals.reload: true
      simpleportals.info: true
      simpleportals.create: true
      simpleportals.delete: true
      simpleportals.fill: true
      simpleportals.setlocation: true
      simpleportals.showregion: true
      simpleportals.toggle: true
      simpleportals.switchserver: true
      simpleportals.setswitchlocation: true
      simpleportals.addcommand: true
      simpleportals.clearcommands: true
      simpleportals.togglecommandonly: true
      simpleportals.commands: true
      simpleportals.disablemessages: true
      simpleportals.message: true
      simpleportals.cooldown: true
      simpleportals.delay: true
      simpleportals.find: true
      simpleportals.portal.*: true
  simpleportals.use:
    description: Use the /sp command at all (sub-commands need their own permission).
    default: op
  simpleportals.portal.*:
    description: Walk through every portal (only checked when require-portal-permission is true).
    default: true
