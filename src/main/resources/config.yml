# SimplePortals (lean rewrite)
# Colors use & codes, e.g. &a green, &c red, &d pink.

prefix: "&8[&dPortals&8] &7"

# ---------- Cross-server (Velocity / BungeeCord) ----------
# This server's name EXACTLY as it appears in velocity.toml [servers], e.g. "lobby" or "survival".
# Only needed on servers that players arrive at through a portal with /sp ssl set.
server-name: "lobby"

# Folder shared by ALL your servers, used to tell the destination server where to put an arriving
# player (/sp ssl). Relative paths start from this server's folder, so with a layout like
#   /minecraft/lobby, /minecraft/survival, /minecraft/creative
# the default "../simpleportals-transfers" makes them all use /minecraft/simpleportals-transfers.
# Install SimplePortals on every server players arrive at and use the same folder on each.
transfer-folder: "../simpleportals-transfers"

# ---------- Portal behaviour ----------
# Seconds before a player can use the same portal again (per-portal /sp cooldown overrides this).
default-cooldown: 3

# How hard players are pushed back out when they can't use a portal (0 = don't push).
push-back: 0.6

# Sound when teleporting. Any sound key works, e.g. "minecraft:entity.enderman.teleport",
# "minecraft:block.portal.travel". Use "none" for silence.
teleport-sound: "minecraft:entity.enderman.teleport"

# If true, players need simpleportals.portal.<name> (or simpleportals.portal.*) to walk through a portal.
require-portal-permission: false

messages:
  cooldown: "&cWait {time}s before using this portal again."
  delay: "&7Teleporting in &d{time}s&7, stay in the portal..."
  no-portal-permission: "&cYou can't use this portal."
